# ============================================================
# MediCare Application Configuration
#
# Values are pulled from environment variables so we never
# commit real credentials to source control.
# The syntax ${ENV_VAR:default} means:
#   "use the environment variable ENV_VAR, and if it isn't set,
#    fall back to the given default value."
# ============================================================

spring.application.name=medicare

# ---------------- Server ----------------
server.port=${SERVER_PORT:8080}

# ---------------- MySQL Datasource ----------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:medicare_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
# update: Hibernate will alter tables to match our entities automatically.
# This is convenient during learning/development. In a real production
# system you would normally switch to "validate" and use migration tools
# like Flyway/Liquibase instead of letting Hibernate change the schema.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------- Logging ----------------
logging.level.org.springframework=INFO
logging.level.com.medicare=DEBUG

# ---------------- JWT ----------------
# jwt.secret MUST be overridden via the JWT_SECRET environment
# variable in any real deployment - the fallback below is only for
# convenience during local development and is NOT safe to use as-is
# for anything beyond your own machine. It must be at least 32
# characters long (256 bits) for the HS256 signing algorithm we use
# in JwtUtil.
jwt.secret=${JWT_SECRET:this-is-a-local-dev-only-secret-key-change-me-1234567890}
# Token lifetime in milliseconds. Default below is 24 hours.
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------------- SMS reminders (Phases 10-12) ----------------
# Which SMS provider to use: "mock" (default - only logs to the console,
# sends nothing) or "twilio" (really sends; needs the three TWILIO_*
# values below). Anything else stops the app at startup with a clear error.
sms.provider=${SMS_PROVIDER:mock}
# Mock only: make every send fail on purpose, to demo failure handling.
sms.mock.simulate-failure=${SMS_MOCK_FAIL:false}
# Twilio credentials - supply via environment variables, never commit them.
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
# Used to turn a stored number like 9876543210 into +919876543210.
sms.default-country-code=${SMS_DEFAULT_COUNTRY_CODE:+91}
sms.gateway.api-key=${SMS_GATEWAY_API_KEY:}
sms.gateway.base-url=${SMS_GATEWAY_URL:}

# Reminder timer. false = no automatic runs (the manual endpoint still works).
reminder.enabled=${REMINDER_ENABLED:true}
# Spring cron, 6 fields (second minute hour day month weekday): every 15 minutes.
reminder.cron=${REMINDER_CRON:0 0/15 * * * *}
# Remind appointments that start within this many hours from now.
reminder.lead-hours=${REMINDER_LEAD_HOURS:24}
# Give up on an appointment after this many FAILED sends.
reminder.max-attempts=${REMINDER_MAX_ATTEMPTS:3}
# Zone in which appointment dates/times are interpreted and the timer runs.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# ---------------- First-admin bootstrap ----------------
# If BOTH are set at startup and no user with that username exists, an
# ADMIN account is created (an existing account is never touched).
# Use it to create the first admin of a fresh database, or to get back in
# after losing an admin password (then reset passwords from the Accounts
# screen). Leave unset normally.
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
